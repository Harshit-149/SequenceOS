services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sequenceos
      POSTGRES_PASSWORD: sequenceos
      POSTGRES_DB: sequenceos
    ports:
      - "5432:5432"
    volumes:
      - sequenceos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sequenceos -d sequenceos"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sequenceos-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sequenceos-postgres:
  sequenceos-redis:
